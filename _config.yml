# ─── Site ────────────────────────────────────────────
title: Oleksandr Simonov
tagline: Engineer first. CEO second.
description: >-
  Engineer · Founder & CEO @ Amoniac OÜ. 20+ years writing code in production.
  Platform Engineering · Cloud-Native · Kubernetes · Ruby · Go.
author: Oleksandr Simonov
email: oleksandr@amoniac.eu
url: "https://simonov.me"
baseurl: ""
lang: en

# ─── Build ───────────────────────────────────────────
markdown: kramdown
sass:
  style: compressed
  sass_dir: _sass

# ─── Plugins (GitHub Pages whitelist only) ──────────
plugins:
  - jekyll-sass-converter
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# ─── SEO / OG ────────────────────────────────────────
twitter:
  username: ""        # add when you have one
  card: summary_large_image
social:
  name: Oleksandr Simonov
  links:
    - https://github.com/simonoff
    - https://www.linkedin.com/in/simonoff
    - https://www.slideshare.net/Amoniac_OU
logo: /assets/img/og.png
defaults:
  - scope: { path: "", type: "pages" }
    values:
      image: /assets/img/og.png
      layout: default

# ─── Analytics ───────────────────────────────────────
# GA4 measurement ID. Loaded only after the visitor accepts cookies.
analytics:
  ga4: G-XXXXXXXXXX   # ← replace with your real ID

include:
  - assets

# ─── Exclude from build ──────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .jekyll-cache
